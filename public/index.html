<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driveo - Ultimate Media Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .driveo-card {
            background: #1e293b;
            width: 100%;
            max-width: 480px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #38bdf8;
            font-size: 28px;
            letter-spacing: 1px;
        }
        .header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 5px;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .input-box {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        .input-box:focus {
            border-color: #38bdf8;
        }
        .btn-fetch {
            padding: 12px 20px;
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-fetch:hover {
            background: #0369a1;
        }
        .result-container {
            display: none;
            border-top: 1px solid #334155;
            padding-top: 15px;
            margin-top: 10px;
        }
        .thumb-box {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .thumb-box img {
            width: 100%;
            display: block;
        }
        .video-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #f1f5f9;
            line-height: 1.4;
        }
        .download-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .dl-btn {
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            font-size: 13px;
            font-weight: bold;
            display: block;
            background: #22c55e;
            transition: 0.2s;
        }
        .dl-btn:hover { background: #16a34a; }
        .dl-btn.audio { background: #eab308; color: #000; }
        .dl-btn.audio:hover { background: #ca8a04; }
        .loader {
            display: none;
            text-align: center;
            margin: 15px 0;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="driveo-card">
    <div class="header">
        <h1>DRIVEO</h1>
        <p>Seal & Snaptube Powered Downloader Engine</p>
    </div>

    <div class="input-group">
        <input type="text" id="videoUrl" class="input-box" placeholder="URL यहाँ पेस्ट करें...">
        <button onclick="processVideo()" class="btn-fetch">Fetch</button>
    </div>

    <div id="loader" class="loader">प्रोसेस हो रहा है, कृपया प्रतीक्षा करें...</div>

    <div id="result" class="result-container">
        <div class="thumb-box">
            <img id="thumb" src="" alt="Thumbnail">
        </div>
        <div id="title" class="video-title"></div>

        <div class="download-options">
            <a id="btn1080" href="#" target="_blank" class="dl-btn">Video (1080p)</a>
            <a id="btn720" href="#" target="_blank" class="dl-btn">Video (720p)</a>
            <a id="btnMp3" href="#" target="_blank" class="dl-btn audio">Audio (MP3)</a>
            <a id="btnBest" href="#" target="_blank" class="dl-btn" style="background:#a855f7;">Best Quality</a>
        </div>
    </div>
</div>

<script>
    async function processVideo() {
        const url = document.getElementById('videoUrl').value.trim();
        if (!url) return alert('कृपया लिंक दर्ज करें!');

        const loader = document.getElementById('loader');
        const result = document.getElementById('result');

        loader.style.display = 'block';
        result.style.display = 'none';

        try {
            // 1. Fetch Metadata
            const res = await fetch('/api/fetch-info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            const info = await res.json();

            if (info.error) {
                alert(info.error);
                loader.style.display = 'none';
                return;
            }

            document.getElementById('thumb').src = info.thumbnail;
            document.getElementById('title').innerText = info.title;

            // 2. Generate Links for Snaptube/Seal Quality Modes
            generateLink(url, '1080p', 'btn1080');
            generateLink(url, '720p', 'btn720');
            generateLink(url, 'mp3', 'btnMp3');
            generateLink(url, 'best', 'btnBest');

            loader.style.display = 'none';
            result.style.display = 'block';

        } catch (err) {
            alert('सर्वर से कनेक्ट करने में त्रुटि हुई।');
            loader.style.display = 'none';
        }
    }

    async function generateLink(url, quality, elementId) {
        const res = await fetch('/api/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url, quality })
        });
        const data = await res.json();
        if (data.downloadUrl) {
            document.getElementById(elementId).href = data.downloadUrl;
        }
    }
</script>

</body>
</html>
